<!doctype html>
<html lang="et">
<head>
<meta charset="utf-8">
<script>document.documentElement.lang = localStorage.getItem("wb_lang") || "et";</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Transcript comparison — Estonian ASR Workbench</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body class="wide">
<header class="site-head" id="site-header"></header>

<main class="wrap">
  <div class="page-head">
    <h1 id="page-h1"></h1>
    <p id="page-intro"></p>
  </div>

  <div class="picker-bar">
    <div>
      <div class="fg-label" id="set-label" style="font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);font-weight:600;margin-bottom:8px;"></div>
      <div class="set-picker" id="set-picker"></div>
    </div>
    <div>
      <div class="fg-label" id="systems-label" style="font-size:.7rem;letter-spacing:.05em;text-transform:uppercase;color:var(--text-faint);font-weight:600;margin-bottom:8px;"></div>
      <div class="sys-picker" id="sys-picker"></div>
      <div class="picker-note" id="picker-note"></div>
    </div>
  </div>

  <div class="legend" id="legend"></div>

  <p class="normalize-note" id="normalize-note"></p>

  <div class="ref-block" id="ref-block"></div>

  <p class="insight-note" id="insight-note"></p>

  <p class="cols-label" id="cols-label"></p>
  <div class="transcript-cols" id="transcript-cols"></div>
</main>

<footer class="site-foot" id="site-footer"></footer>

<script src="js/i18n.js"></script>
<script src="js/data.js"></script>
<script src="js/transcripts.js"></script>
</body>
</html>
